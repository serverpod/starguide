name: starguide_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: ">=3.12.2 <4.0.0"

resolution: workspace

dependencies:
  http: ^1.3.0
  # Pinned: 3.4.2 uses the nested embedding config that googleai_dart 8-12
  # silently drop for the Gemini API, so the 768-dimension setting is ignored
  # and embeddings come back with 3072 dimensions. Unpin once dartantic_ai
  # depends on googleai_dart 13 or later, which fixes the serialization.
  dartantic_ai: 3.4.1
  jev_dart: ^0.1.2
  pub_semver: ^2.2.0
  serverpod: 4.0.1
  serverpod_auth_core_server: 4.0.1
  serverpod_auth_idp_server: 4.0.1

dev_dependencies:
  lints: ">=3.0.0 <6.0.0"
  test: "^1.24.2"
  serverpod_test: 4.0.1

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\starguide_flutter
        && flutter build web --base-href /
        && xcopy /E /I /Y build\web ..\starguide_server\web\app
      posix: |
        cd ../starguide_flutter
        flutter build web --no-tree-shake-icons --base-href / --output ../starguide_server/web/app
  flutter_apps:
    starguide:
      path: ../starguide_flutter
      displayName: "Starguide app"
      auto_launch: true
      target: lib/main.dart
      web-port: 8888